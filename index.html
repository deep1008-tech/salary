<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Salary Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f2fcfe, #e4f4f9);
      padding: 20px;
      max-width: 700px;
      margin: auto;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
      font-size: 24px;
    }

    .item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
      background-color: #ffffffcc;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .item-name {
      min-width: 160px;
      font-weight: 600;
    }

    input[type="number"] {
      width: 100px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .price {
      color: #555;
    }

    button {
      margin-top: 25px;
      padding: 12px 20px;
      font-size: 16px;
      background-color: #27ae60;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      width: 100%;
    }

    button:hover {
      background-color: #219150;
    }

    #total {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
      color: #e74c3c;
      text-align: center;
    }

    @media screen and (max-width: 480px) {
      .item {
        flex-direction: column;
        align-items: flex-start;
      }

      .item-name, .price, input {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <h2>Salary Calculator (પગાર ગણતરી) 🧾</h2>

  <div class="item">
    <div class="item-name">1. Barbie (બાર્બી)</div>
    <label>Qty:</label><input type="number" id="qty1">
    <div class="price">₹15</div>
  </div>

  <div class="item">
    <div class="item-name">2. Vivah (વિવાહ)</div>
    <label>Qty:</label><input type="number" id="qty2">
    <div class="price">₹15</div>
  </div>

  <div class="item">
    <div class="item-name">3. Radha Rani (રાધા રાણી)</div>
    <label>Qty:</label><input type="number" id="qty3">
    <div class="price">₹14</div>
  </div>

  <div class="item">
    <div class="item-name">4. Foil (ફોઈલ)</div>
    <label>Qty:</label><input type="number" id="qty4">
    <div class="price">₹14</div>
  </div>

  <div class="item">
    <div class="item-name">5. Doli (ડોલી)</div>
    <label>Qty:</label><input type="number" id="qty5">
    <div class="price">₹14</div>
  </div>

  <div class="item">
    <div class="item-name">6. Gulabo (ગુલાબો)</div>
    <label>Qty:</label><input type="number" id="qty6">
    <div class="price">₹11</div>
  </div>

  <div class="item">
    <div class="item-name">7. TV Cover 1 (ટીવી કવર ૧)</div>
    <label>Qty:</label><input type="number" id="qty7">
    <div class="price">₹11</div>
  </div>

  <div class="item">
    <div class="item-name">8. TV Cover 2 (ટીવી કવર ૨)</div>
    <label>Qty:</label><input type="number" id="qty8">
    <div class="price">₹12</div>
  </div>

  <button onclick="calculateTotal()">કુલ જોડાણ બતાવો</button>
  <button onclick="printDetails()">પ્રિન્ટ કરો અથવા ડાઉનલોડ કરો</button>

  <div id="total">કુલ રકમ: ₹0</div>

  <!-- Hidden section to print -->
  <div id="printable-area" style="display:none;">
    <h2>પગાર વિગત (Salary Details)</h2>
    <div id="print-details"></div>
    <div id="print-total" style="font-weight:bold; margin-top: 15px;"></div>
  </div>

  <script>
    const prices = [15, 15, 14, 14, 14, 11, 11, 12];
    const names = [
      "1. Barbie (બાર્બી)",
      "2. Vivah (વિવાહ)",
      "3. Radha Rani (રાધા રાણી)",
      "4. Foil (ફોઈલ)",
      "5. Doli (ડોલી)",
      "6. Gulabo (ગુલાબો)",
      "7. TV Cover 1 (ટીવી કવર ૧)",
      "8. TV Cover 2 (ટીવી કવર ૨)"
    ];

    function calculateTotal() {
      let total = 0;
      const details = [];

      for (let i = 1; i <= 8; i++) {
        const qty = parseFloat(document.getElementById(`qty${i}`).value) || 0;
        const price = prices[i - 1];
        if (qty > 0) {
          const itemTotal = qty * price;
          details.push(`${names[i - 1]} - Qty: ${qty} × ₹${price} = ₹${itemTotal.toFixed(2)}`);
          total += itemTotal;
        }
      }

      document.getElementById("total").textContent = "કુલ રકમ: ₹" + total.toFixed(2);

      document.getElementById("print-details").innerHTML = details.map(item => `<div>${item}</div>`).join('');
      document.getElementById("print-total").textContent = "કુલ રકમ: ₹" + total.toFixed(2);
    }

    function printDetails() {
      calculateTotal(); // Make sure calculation is fresh

      const printContents = document.getElementById("printable-area").innerHTML;
      const originalContents = document.body.innerHTML;

      document.body.innerHTML = printContents;
      window.print();
      document.body.innerHTML = originalContents;
      location.reload(); // Reload to restore event listeners
    }
  </script>

</body>
</html>
